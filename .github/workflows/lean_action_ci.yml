name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# No documentation is generated on this branch, so read access is all that is
# needed — the Pages and id-token permissions the docgen step required are gone.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # `leanprover-community/docgen-action` is deliberately absent: this branch
      # carries no correctness development, so there is no proof API worth
      # publishing.  It also could not run as-is — docgen asks every default
      # target for its `docs` facet, and `defaultTargets` here includes the
      # `BEer` executable, which has no such facet ("unknown lean_exe facet
      # `docs`").
