name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Two editions are built from two branches, on three platforms each.
  #
  #   BEer       (main)       the certified encoder
  #   BEer-zero  (beer-lite)  Zero-Proof BEer: no correctness proofs, wider B
  #                           coverage, and the optimised encoder
  #
  # Both branches expose the same `BEer` executable target, so only the checked
  # out ref differs.  `main`'s defaultTargets include `Correctness`, which is why
  # the target is named explicitly rather than left to `lake build`.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        edition:
          - id: BEer
            ref: main
          - id: BEer-zero
            ref: beer-lite
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.edition.ref }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          build: true
          build-args: "BEer"

      - name: Upload ${{ matrix.edition.id }} artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition.id }}-${{ runner.os }}
          path: .lake/build/bin/BEer
          if-no-files-found: error

      - name: Upload ${{ matrix.edition.id }} artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition.id }}-${{ runner.os }}
          path: .lake/build/bin/BEer.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      # No `name`, so every artifact from the matrix lands in its own
      # subdirectory of `dist/`.
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Artifact directories are `<edition>-<RunnerOS>`; assets are
      # `<edition>-<platform>`, keeping the names the previous release used.
      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p out
          for d in dist/*/; do
            name=$(basename "$d")
            edition=${name%-*}
            case ${name##*-} in
              Linux)   platform=linux ;;
              macOS)   platform=macos ;;
              Windows) platform=windows.exe ;;
              *) echo "unexpected artifact $name" >&2; exit 1 ;;
            esac
            binary=$(find "$d" -type f | head -1)
            [ -n "$binary" ] || { echo "no binary in $d" >&2; exit 1; }
            cp "$binary" "out/${edition}-${platform}"
          done
          ls -l out
          test "$(ls out | wc -l)" -eq 6

      # `gh` replaces the previous fetch/delete/create/upload chain, two steps of
      # which used actions GitHub has archived.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete beer --yes --cleanup-tag || true
          gh release create beer out/* \
            --target "${{ github.sha }}" \
            --title "BEer" \
            --notes "Automated release for Linux, macOS, and Windows.

          | asset | branch | what it is |
          | --- | --- | --- |
          | \`BEer-*\` | \`main\` | the certified encoder |
          | \`BEer-zero-*\` | \`beer-lite\` | Zero-Proof BEer — no correctness proofs, wider B coverage |"
