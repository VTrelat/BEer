name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
        with:
          # The action treats `homepage` as a Jekyll site: if that folder exists
          # it runs `bundle exec jekyll build` there.  The default is `docs`,
          # which here holds prose notes and no Gemfile, so the build failed.
          # Pointing at a folder that only the action creates skips Jekyll; the
          # API docs are generated into it and deployed from there.
          homepage: site
