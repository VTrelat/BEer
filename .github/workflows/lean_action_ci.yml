name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
        with:
          # `docs/` here holds prose notes, not a Jekyll site, and the action's
          # default `homepage: docs` makes it run `bundle exec jekyll build`
          # there — which fails for want of a Gemfile.  Only the API docs are
          # wanted.
          build-page: "false" # string, as the action compares it to 'true'
